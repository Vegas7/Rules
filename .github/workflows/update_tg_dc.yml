name: Update Telegram DC List

on:
  schedule:
    # 每天北京时间早上 6:00 运行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Rules
        run: |
          # 1. 准备目录
          mkdir -p Surge
          mkdir -p Mihomo
          
          # 2. 定义文件路径
          SURGE_FILE="Surge/telegram_dc.conf"
          MIHOMO_FILE="Mihomo/telegram_dc.txt"
          
          # 3. 获取当前时间 (北京时间)
          CURRENT_DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 4. 写入头部注释 - Surge
          echo "# Telegram Official DC List (Surge)" > $SURGE_FILE
          echo "# Source: https://core.telegram.org/resources/cidr.txt" >> $SURGE_FILE
          echo "# Updated: $CURRENT_DATE" >> $SURGE_FILE
          echo "" >> $SURGE_FILE

          # 5. 写入头部注释 - Mihomo (支持 # 注释)
          echo "# Telegram Official DC List (Mihomo/Clash)" > $MIHOMO_FILE
          echo "# Source: https://core.telegram.org/resources/cidr.txt" >> $MIHOMO_FILE
          echo "# Updated: $CURRENT_DATE" >> $MIHOMO_FILE
          echo "" >> $MIHOMO_FILE
          
          # 6. 下载并分流处理数据
          # 逻辑：直接读取官方源，一行一行处理，同时写入两个文件，效率最高。
          
          curl -sL https://core.telegram.org/resources/cidr.txt | while read line; do
            # 跳过空行
            if [ -z "$line" ]; then continue; fi
            
            # --- 处理 Surge 格式 ---
            # 区分 IPv6 使用 IP-CIDR6
            if [[ "$line" == *":"* ]]; then
              echo "IP-CIDR6,$line,no-resolve" >> $SURGE_FILE
            else
              echo "IP-CIDR,$line,no-resolve" >> $SURGE_FILE
            fi
            
            # --- 处理 Mihomo 格式 ---
            # Mihomo 纯文本 Rule Provider 只需要纯 CIDR，不需要前缀
            echo "$line" >> $MIHOMO_FILE
          done
          
          # 7. 打印预览 (方便在 Actions 日志中检查)
          echo "=== Surge File Preview ==="
          head -n 6 $SURGE_FILE
          echo "..."
          echo "=== Mihomo File Preview ==="
          head -n 6 $MIHOMO_FILE

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加两个文件
          git add Surge/telegram_dc.conf
          git add Mihomo/telegram_dc.txt
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-update Telegram DC lists: $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
            git push
          fi
